<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniFi AI Dashboard</title>
<style>
/* ── Reset ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Design Tokens ──────────────────────────────────────────────────────── */
:root {
  --bg:          #09101E;
  --bg-card:     #0D1526;
  --bg-input:    #0A1220;
  --bg-hover:    rgba(255,255,255,0.03);
  --border:      #182B44;
  --accent:      #006FFF;
  --accent-dim:  rgba(0,111,255,0.15);
  --text:        #D4E3F5;
  --text-dim:    #4E6F96;
  --text-mid:    #8AAACA;
  --ok:          #22C55E;
  --warn:        #F59E0B;
  --danger:      #EF4444;
  --radius:      8px;
  --font:        -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
}

html, body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 13px;
  height: 100%; overflow: hidden; margin: 0;
}

/* ── Layout grid: sidebar | (topbar / content) ──────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 54px 1fr;
  grid-template-rows: 48px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ────────────────────────────────────────────────────────────── */
.sidebar {
  grid-row: 1 / 3;
  background: #070D1A;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 0 12px; gap: 2px;
}

.logo-wrap { margin-bottom: 14px; }
.logo-wrap svg { width: 30px; height: 30px; display: block; }

.nav-btn {
  position: relative;
  width: 38px; height: 38px; border-radius: 10px;
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.nav-btn svg { width: 17px; height: 17px; pointer-events: none; }
.nav-btn:hover   { background: rgba(0,111,255,0.1); color: var(--text-mid); }
.nav-btn.active  { background: rgba(0,111,255,0.18); color: var(--accent); }

.nav-tip {
  position: absolute; left: 46px; top: 50%; transform: translateY(-50%);
  background: #1A2D47; color: var(--text); padding: 4px 10px;
  border-radius: 5px; white-space: nowrap; font-size: 11px;
  border: 1px solid var(--border); pointer-events: none;
  opacity: 0; transition: opacity 0.12s; z-index: 200;
}
.nav-btn:hover .nav-tip { opacity: 1; }

.sidebar-gap { flex: 1; }

/* ── Topbar ─────────────────────────────────────────────────────────────── */
.topbar {
  grid-column: 2;
  background: #070D1A;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
}

.status-chip {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 10px;
  font-size: 11px; color: var(--text-mid);
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-dim); flex-shrink: 0;
}
.dot.ok     { background: var(--ok);     box-shadow: 0 0 5px var(--ok); }
.dot.warn   { background: var(--warn);   box-shadow: 0 0 5px var(--warn); }
.dot.danger { background: var(--danger); box-shadow: 0 0 5px var(--danger); }
.dot.pulse  { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

.topbar-title {
  font-size: 13px; font-weight: 600; color: var(--text);
  margin-left: 4px; flex: 1;
}

.btn {
  border: none; border-radius: 6px; padding: 6px 13px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background 0.13s, opacity 0.13s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #005CE6; }
.btn-ghost {
  background: rgba(255,255,255,0.05); color: var(--text);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: rgba(255,255,255,0.09); }
.btn:disabled { opacity: .38; cursor: not-allowed; }

/* ── Content area ───────────────────────────────────────────────────────── */
.content {
  grid-column: 2;
  grid-row: 2;
  display: grid;
  grid-template-columns: 1fr 380px;
  overflow: hidden;
  min-height: 0;
  max-height: calc(100vh - 48px);   /* hard cap to topbar height */
}

/* ── Data panel ─────────────────────────────────────────────────────────── */
.data-panel {
  overflow-y: auto; padding: 14px 14px 32px 14px;  /* extra bottom pad */
  display: flex; flex-direction: column; gap: 12px;
  min-height: 0;
}
.data-panel::-webkit-scrollbar { width: 4px; }
.data-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Metric row */
.metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.metric-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
}
.metric-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-dim); margin-bottom: 5px;
}
.metric-val { font-size: 28px; font-weight: 700; line-height: 1; }
.metric-val.ok     { color: var(--ok); }
.metric-val.warn   { color: var(--warn); }
.metric-val.danger { color: var(--danger); }
.metric-sub { font-size: 10px; color: var(--text-dim); margin-top: 3px; }

/* Card */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  flex-shrink: 0;   /* prevent cards from shrinking inside flex data-panel */
}
.card-head {
  padding: 9px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim);
}
.badge {
  font-size: 10px; font-weight: 600; border-radius: 10px; padding: 2px 8px;
  background: var(--accent-dim); color: var(--accent);
}
.badge.warn   { background: rgba(245,158,11,.15); color: var(--warn); }
.badge.danger { background: rgba(239,68,68,.15);  color: var(--danger); }
.badge.ok     { background: rgba(34,197,94,.15);  color: var(--ok); }

/* Table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  padding: 7px 14px; text-align: left;
  font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-dim); border-bottom: 1px solid var(--border); font-weight: 600;
}
td {
  padding: 7px 14px; font-size: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-hover); }
.mono { font-family: 'Consolas','SF Mono',monospace; font-size: 11px; color: var(--text-mid); }

/* Alarm list */
.alarm-list { list-style: none; }
.alarm-item {
  padding: 7px 14px; border-bottom: 1px solid rgba(255,255,255,0.03);
  font-size: 11px; color: var(--text-mid);
  display: flex; align-items: flex-start; gap: 8px; line-height: 1.5;
}
.alarm-item:last-child { border-bottom: none; }
.alarm-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--warn); flex-shrink: 0; margin-top: 4px;
}

/* Device health card */
.device-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px 14px;
}
.bar-track {
  height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
}
.bar-fill { height: 3px; border-radius: 2px; }

/* Empty state */
.empty {
  padding: 32px 16px; text-align: center;
  color: var(--text-dim); font-size: 12px;
}
.empty svg { opacity: .14; margin: 0 auto 12px; display: block; }

/* ── AI panel ───────────────────────────────────────────────────────────── */
.ai-panel {
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
}
.ai-head {
  padding: 9px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.ai-title {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim);
}
.ai-model-name { font-size: 10px; color: var(--text-dim); }

.ai-output {
  flex: 1; overflow-y: auto; padding: 14px;
  font-size: 12px; line-height: 1.65; color: var(--text);
}
.ai-output::-webkit-scrollbar { width: 4px; }
.ai-output::-webkit-scrollbar-thumb { background: var(--border); }

/* Markdown styles inside AI output */
.ai-output p      { margin-bottom: 9px; }
.ai-output ul     { padding-left: 16px; margin-bottom: 9px; }
.ai-output li     { margin-bottom: 4px; }
.ai-output strong { color: #fff; }
.ai-output h3     { font-size: 12px; color: var(--text); margin: 12px 0 5px; }
.ai-output code   {
  background: rgba(0,111,255,0.12); color: #7EC8FF;
  padding: 1px 5px; border-radius: 3px;
  font-size: 11px; font-family: monospace;
}
.verdict {
  margin-top: 12px; padding: 9px 12px;
  background: rgba(0,111,255,0.07); border-left: 3px solid var(--accent);
  border-radius: 0 4px 4px 0; font-size: 12px;
}
.b-high { display:inline-block; background:rgba(239,68,68,.18);  color:#EF4444; border-radius:3px; padding:0px 6px; font-size:10px; font-weight:700; }
.b-med  { display:inline-block; background:rgba(245,158,11,.18); color:#F59E0B; border-radius:3px; padding:0px 6px; font-size:10px; font-weight:700; }
.b-low  { display:inline-block; background:rgba(34,197,94,.18);  color:#22C55E; border-radius:3px; padding:0px 6px; font-size:10px; font-weight:700; }

.ai-placeholder {
  color: var(--text-dim); text-align: center; padding: 48px 20px;
}
.ai-placeholder svg { width: 44px; height: 44px; opacity: .12; margin: 0 auto 14px; display: block; }

.cursor {
  display: inline-block; width: 2px; height: 13px;
  background: var(--accent); vertical-align: text-bottom;
  margin-left: 1px; animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }

/* Custom prompt area */
.prompt-area {
  border-top: 1px solid var(--border);
  padding: 10px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 6px;
}
.prompt-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--text-dim);
}
.prompt-row { display: flex; gap: 6px; align-items: flex-end; }
textarea.prompt-ta {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); padding: 7px 10px;
  font-size: 12px; font-family: var(--font);
  resize: none; height: 52px; outline: none;
}
textarea.prompt-ta:focus  { border-color: var(--accent); }
textarea.prompt-ta::placeholder { color: var(--text-dim); }

/* ── Modal ──────────────────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: none; align-items: center; justify-content: center;
  z-index: 300; backdrop-filter: blur(4px);
}
.overlay.open { display: flex; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; width: 540px; max-height: 78vh;
  display: flex; flex-direction: column;
  box-shadow: 0 32px 80px rgba(0,0,0,.55);
}
.modal-head {
  padding: 15px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-weight: 600; font-size: 14px; }
.modal-close {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 18px; padding: 2px 6px; border-radius: 4px; line-height: 1;
}
.modal-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.modal-body { flex: 1; overflow-y: auto; padding: 14px 18px; }
.modal-foot {
  padding: 11px 18px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}

.model-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 6px;
  border: 1px solid var(--border); margin-bottom: 7px;
  background: rgba(255,255,255,0.02);
}
.model-row:hover { background: rgba(255,255,255,0.04); }
.model-id   { flex: 1; font-size: 11px; word-break: break-all; color: var(--text-mid); }
.loaded-tag {
  font-size: 10px; color: var(--ok);
  background: rgba(34,197,94,.12); padding: 2px 8px; border-radius: 10px;
}

/* ── Spinner ────────────────────────────────────────────────────────────── */
.spin {
  display: inline-block; width: 13px; height: 13px;
  border: 2px solid rgba(255,255,255,.2); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Trends ─────────────────────────────────────────────────────────────── */
.trend-select {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); padding: 8px 12px;
  font-size: 12px; font-family: var(--font); outline: none; cursor: pointer;
}
.trend-select:focus { border-color: var(--accent); }
.trend-date {
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); padding: 8px 12px;
  font-size: 12px; font-family: var(--font); outline: none;
}
.trend-date:focus { border-color: var(--accent); }
.compare-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px;
}
.compare-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.compare-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-dim); margin-bottom: 12px; font-weight: 600;
}
.compare-stat {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 12px;
}
.compare-stat:last-child { border-bottom: none; }
.compare-stat-label { color: var(--text-dim); }
.compare-stat-val   { font-weight: 600; color: var(--text); }
.delta-good { color: var(--ok); }
.delta-bad  { color: var(--danger); }
.delta-neutral { color: var(--text-dim); }

* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
</style>
</head>
<body>

<div class="layout">

  <!-- ══ Sidebar ══════════════════════════════════════════════════════════ -->
  <nav class="sidebar">

    <div class="logo-wrap" title="UniFi AI Dashboard">
      <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="15" cy="15" r="15" fill="#006FFF"/>
        <path d="M15 6 L22 10.5 L22 19.5 L15 24 L8 19.5 L8 10.5 Z"
              fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
        <circle cx="15" cy="15" r="4" fill="white"/>
        <circle cx="15" cy="15" r="1.5" fill="#006FFF"/>
      </svg>
    </div>

    <button class="nav-btn active" onclick="switchPreset('security',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7l-9-5z"/>
      </svg>
      <span class="nav-tip">Security</span>
    </button>

    <button class="nav-btn" onclick="switchPreset('health',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
        <polyline points="6 10 9 10 11 7 13 13 15 10 18 10"/>
      </svg>
      <span class="nav-tip">Device Health</span>
    </button>

    <button class="nav-btn" onclick="switchPreset('performance',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span class="nav-tip">Performance</span>
    </button>

    <button class="nav-btn" onclick="switchPreset('diagnostics',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
      <span class="nav-tip">Diagnostics</span>
    </button>

    <button class="nav-btn" onclick="switchPreset('trends',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
        <polyline points="16 7 22 7 22 13"/>
      </svg>
      <span class="nav-tip">Bandwidth Trends</span>
    </button>

    <div class="sidebar-gap"></div>

    <button class="nav-btn" onclick="openModels()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83
                 M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
      <span class="nav-tip">AI Models</span>
    </button>

  </nav>

  <!-- ══ Topbar ════════════════════════════════════════════════════════════ -->
  <div class="topbar">
    <div class="status-chip">
      <div class="dot" id="unifi-dot"></div>
      <span id="unifi-lbl">UniFi</span>
    </div>
    <div class="status-chip">
      <div class="dot" id="lm-dot"></div>
      <span id="lm-lbl">LM Studio</span>
    </div>
    <span class="topbar-title" id="preset-title">Security Overview</span>
    <button class="btn btn-ghost" id="fetchBtn" onclick="fetchData()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Fetch Data
    </button>
    <button class="btn btn-primary" id="analyzeBtn" disabled onclick="runAnalysis('')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      Analyze
    </button>
  </div>

  <!-- ══ Content ═══════════════════════════════════════════════════════════ -->
  <div class="content">

    <!-- Data panel -->
    <div class="data-panel" id="dataPanel">
      <div class="empty" style="margin-top:50px">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Click <strong>Fetch Data</strong> to load network information
      </div>
    </div>

    <!-- AI panel -->
    <div class="ai-panel">
      <div class="ai-head">
        <span class="ai-title">AI Analysis</span>
        <span class="ai-model-name" id="ai-model-name"></span>
      </div>
      <div class="ai-output" id="aiOutput">
        <div class="ai-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Fetch data then click <strong>Analyze</strong> to get AI insights
        </div>
      </div>
      <div class="prompt-area">
        <div class="prompt-label">Custom Prompt</div>
        <div class="prompt-row">
          <textarea class="prompt-ta" id="customPrompt"
            placeholder="Ask a specific question about your network data…"></textarea>
          <button class="btn btn-ghost" onclick="runCustom()"
            style="height:52px;align-self:flex-end;padding:0 13px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ══ Model modal ════════════════════════════════════════════════════════ -->
<div class="overlay" id="modelOverlay" onclick="if(event.target===this)closeModels()">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">AI Model Management</span>
      <button class="modal-close" onclick="closeModels()">✕</button>
    </div>
    <div class="modal-body" id="modelBody">
      <div class="empty">Loading…</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModels()">Close</button>
      <button class="btn btn-ghost" onclick="loadModelList()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Refresh
      </button>
    </div>
  </div>
</div>

<!-- ══ JavaScript ════════════════════════════════════════════════════════ -->
<script>
// ── State ──────────────────────────────────────────────────────────────────
let preset      = 'security';
let fetchedData = null;
let analyzing   = false;

const TITLES = {
  security:    'Security Overview',
  health:      'Device Health',
  performance: 'Network Performance',
  diagnostics: 'Data Diagnostics',
  trends:      'Bandwidth Trends',
};

// ── Boot ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  pollStatus();
  setInterval(pollStatus, 15_000);
});

// ── Status polling ─────────────────────────────────────────────────────────
async function pollStatus() {
  try {
    const d = await apiFetch('/api/status');
    renderUniFiStatus(d.unifi);
    renderLMStatus(d.lmstudio);
  } catch {
    dot('unifi-dot', 'danger');
  }
}

function renderUniFiStatus(s) {
  dot('unifi-dot', s.ok ? 'ok' : 'danger');
  id('unifi-lbl').textContent = s.ok ? 'UniFi Connected' : 'UniFi Offline';
}

function renderLMStatus(s) {
  const modelEl = id('ai-model-name');
  if (!s.running) {
    dot('lm-dot', 'danger');
    id('lm-lbl').textContent = 'LM Studio Offline';
    modelEl.textContent = '';
    return;
  }
  const loaded = s.loaded_models || [];
  if (loaded.length === 0) {
    dot('lm-dot', 'warn');
    id('lm-lbl').textContent = 'No model loaded';
    modelEl.textContent = '';
    return;
  }
  const active = loaded[0];
  const short  = active.split('/').pop();
  dot('lm-dot', s.model_ready ? 'ok' : 'warn');
  id('lm-lbl').textContent = short;
  modelEl.textContent      = short;
}

function dot(elemId, cls) {
  id(elemId).className = 'dot ' + cls;
}

// ── Preset switching ───────────────────────────────────────────────────────
function switchPreset(p, btn) {
  preset      = p;
  fetchedData = null;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  id('preset-title').textContent = TITLES[p] || p;
  resetAIPanel();

  if (p === 'trends') {
    id('analyzeBtn').style.display = 'none';
    id('fetchBtn').style.display   = 'none';
    loadTrends();
    return;
  }

  // Restore buttons when switching away from trends
  id('fetchBtn').style.display   = '';
  id('analyzeBtn').style.display = '';
  id('fetchBtn').disabled   = false;
  id('analyzeBtn').disabled = true;
  id('dataPanel').innerHTML = `<div class="empty" style="margin-top:50px">
    Click <strong>Fetch Data</strong> to load ${TITLES[p]}</div>`;
}

// ── Fetch data ─────────────────────────────────────────────────────────────
async function fetchData() {
  const btn = id('fetchBtn');
  setLoading(btn, 'Fetching…');

  try {
    const body = await apiFetch(`/api/data/${preset}`);
    if (!body.ok) throw new Error(body.error || 'API error');
    fetchedData = body.data;
    renderData(body.data);
    id('analyzeBtn').disabled = false;
  } catch (e) {
    id('dataPanel').innerHTML =
      `<div class="empty" style="color:var(--danger)">Error: ${esc(e.message)}</div>`;
  } finally {
    resetBtn(btn, `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>Fetch Data`);
  }
}

// ── Render helpers ─────────────────────────────────────────────────────────
function renderData(data) {
  const map = {
    security:    renderSecurity,
    health:      renderHealth,
    performance: renderPerformance,
    diagnostics: renderDiagnostics,
  };
  id('dataPanel').innerHTML = (map[data.preset] || renderSecurity)(data);
}

                font-size:10px;color:var(--text-dim);margin-bottom:3px">

// ── Analysis ───────────────────────────────────────────────────────────────
async function runAnalysis(customPrompt) {
  if (analyzing || !fetchedData) return;
  analyzing = true;

  const btn = id('analyzeBtn');
  setLoading(btn, 'Analyzing…');

  const out = id('aiOutput');
  out.innerHTML = '<span class="cursor"></span>';
  let buf = '';

  try {
    const resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({preset, custom_prompt: customPrompt, data: fetchedData}),
    });

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let partial   = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      partial += decoder.decode(value, {stream: true});
      const lines = partial.split('\n');
      partial = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const p = JSON.parse(line.slice(6));
          if (p.done) break;
          if (p.chunk) {
            buf += p.chunk;
            out.innerHTML = mdToHtml(buf) + '<span class="cursor"></span>';
            out.scrollTop = out.scrollHeight;
          }
        } catch {}
      }
    }
    out.innerHTML = mdToHtml(buf);
  } catch(e) {
    out.innerHTML = `<div style="color:var(--danger)">Error: ${esc(e.message)}</div>`;
  } finally {
    analyzing = false;
    resetBtn(btn, `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/>
      </svg>Analyze`);
  }
}

async function runCustom() {
  const t = id('customPrompt').value.trim();
  if (!t || !fetchedData) return;
  await runAnalysis(t);
}

// ── Markdown → HTML ────────────────────────────────────────────────────────
function mdToHtml(raw) {
  // Split on double newlines for paragraphs
  const blocks = raw.split(/\n{2,}/);
  return blocks.map(block => {
    // Bullet list block
    if (/^[-•*] /m.test(block)) {
      const items = block.split('\n')
        .filter(l => l.trim())
        .map(l => `<li>${inlineMarkup(l.replace(/^[-•*]\s+/, ''))}</li>`)
        .join('');
      return `<ul>${items}</ul>`;
    }
    // Heading
    if (/^#+\s/.test(block)) {
      return `<h3>${inlineMarkup(block.replace(/^#+\s+/, ''))}</h3>`;
    }
    // Overall verdict line — wrap in styled box
    if (/overall verdict/i.test(block)) {
      return `<div class="verdict">${inlineMarkup(block)}</div>`;
    }
    // Normal paragraph with line breaks
    const html = block.split('\n').map(inlineMarkup).join('<br>');
    return `<p>${html}</p>`;
  }).join('');
}

function inlineMarkup(s) {
  return esc(s)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g,     '<code>$1</code>')
    .replace(/\bHIGH\b/g,      '<span class="b-high">HIGH</span>')
    .replace(/\bMED\b/g,       '<span class="b-med">MED</span>')
    .replace(/\bLOW\b/g,       '<span class="b-low">LOW</span>')
    .replace(/^→\s+/,          '→ ');
}

// ── Model modal ────────────────────────────────────────────────────────────
function openModels() {
  id('modelOverlay').classList.add('open');
  loadModelList();
}
function closeModels() {
  id('modelOverlay').classList.remove('open');
}

async function loadModelList() {
  id('modelBody').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  try {
    const [mr, sr] = await Promise.all([
      apiFetch('/api/models'),
      apiFetch('/api/status'),
    ]);
    const loaded = sr.lmstudio?.loaded_models || [];
    const models = mr.models || [];

    if (!models.length) {
      id('modelBody').innerHTML = '<div class="empty">No models found — is LM Studio running?</div>';
      return;
    }

    id('modelBody').innerHTML = models.map(m => {
      const mid  = m.id || m.path || JSON.stringify(m);
      const isOn = loaded.includes(mid);
      return `<div class="model-row">
        <div class="model-id">${esc(mid)}</div>
        ${isOn ? '<span class="loaded-tag">Loaded</span>' : ''}
        ${isOn
          ? `<button class="btn btn-ghost" style="font-size:11px;padding:4px 10px"
               onclick="doUnload('${esc(mid)}')">Unload</button>`
          : `<button class="btn btn-primary" style="font-size:11px;padding:4px 10px"
               onclick="doLoad('${esc(mid)}')">Load</button>`}
      </div>`;
    }).join('');
  } catch(e) {
    id('modelBody').innerHTML =
      `<div class="empty" style="color:var(--danger)">Error: ${esc(e.message)}</div>`;
  }
}

async function doLoad(modelId) {
  id('modelBody').innerHTML = `
    <div class="empty">
      <div class="spin"></div><br>
      Loading <strong>${esc(modelId)}</strong>…<br>
      <small style="color:var(--text-dim)">Large models may take several minutes</small>
    </div>`;
  await apiFetch('/api/models/load', {method:'POST', body:{model_id:modelId}});
  pollUntilLoaded(modelId);
}

async function doUnload(modelId) {
  await apiFetch('/api/models/unload', {method:'POST', body:{model_id:modelId}});
  loadModelList();
  pollStatus();
}

async function pollUntilLoaded(modelId) {
  for (let i = 0; i < 60; i++) {
    await sleep(5000);
    const d = await apiFetch('/api/status');
    renderLMStatus(d.lmstudio);
    if ((d.lmstudio?.loaded_models || []).includes(modelId)) {
      loadModelList();
      return;
    }
  }
  loadModelList();
}

// ── Utilities ──────────────────────────────────────────────────────────────
function id(x) { return document.getElementById(x); }

function esc(s) {
  if (s == null) return '—';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function apiFetch(url, opts = {}) {
  const {method = 'GET', body} = opts;
  const init = {method, headers: {'Content-Type':'application/json'}};
  if (body) init.body = JSON.stringify(body);
  const r = await fetch(url, init);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function setLoading(btn, label) {
  btn.disabled = true;
  btn.innerHTML = `<div class="spin"></div> ${label}`;
}

function resetBtn(btn, innerHTML) {
  btn.disabled = false;
  btn.innerHTML = innerHTML;
}

function resetAIPanel() {
  id('aiOutput').innerHTML = `
    <div class="ai-placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Fetch data then click <strong>Analyze</strong> to get AI insights
    </div>`;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
